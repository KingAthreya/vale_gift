<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You Said YES! 💕</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Floating hearts background container -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Music Player Widget -->
    <div class="music-player" id="musicPlayer">
      <div class="music-icon">🎵</div>
      <div class="music-info">
        <span class="music-label">Now Playing</span>
        <span class="music-title">You & Me - James TW</span>
      </div>
      <div class="music-visualizer">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- YouTube Audio Embed (Hidden) -->
    <div class="audio-container" id="audioContainer">
      <iframe
        id="youtubePlayer"
        width="0"
        height="0"
        src="https://www.youtube.com/embed/OTOmQmOFeVo?autoplay=1&loop=1&playlist=OTOmQmOFeVo"
        title="You & Me - James TW"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        allowfullscreen
      ></iframe>
    </div>

    <!-- Main content wrapper - Landing Page (Success Message) -->
    <main class="proposal-container" id="mainContainer">
      <div class="success-heart">💕</div>
      <h2>You said YES!</h2>
      <p class="success-text">You've made me the happiest person alive!</p>
      <p class="mine-text">
        And don't you forget...
        <span class="highlight">You're MINE</span>
        💝
      </p>
      <p class="surprise-text">
        Be ready to have the most amazing 7 days of your life full of gifts and
        surprises! 🎁✨
      </p>
      <p class="love-note">Forever & Always 💘</p>
      <p class="signature">~ Your Athreya</p>

      <!-- Unlock Gift Button -->
      <button class="btn btn-gift" id="unlockGiftBtn">
        🎁 Unlock Your First Gift
      </button>
    </main>

    <!-- Confetti container for celebration effect -->
    <div class="confetti-container" id="confettiContainer"></div>

    <script src="script.js"></script>
  </body>
</html>
